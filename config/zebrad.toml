# Zebra configuration for ZPulse Observatory
# Official Zcash Foundation node (zebrad)

[network]
# Set to "Mainnet" for live Zcash chain, or "Testnet" for testing
network = "Mainnet"
listen_addr = "0.0.0.0:8233"

[rpc]
# Listen on all interfaces inside container/localhost for JSON-RPC
listen_addr = "0.0.0.0:8232"

# Set to false for seamless container / local development access without cookie file
enable_cookie_auth = false

[consensus]
# Verification of all consensus rules
checkpoint_sync = true

[sync]
# Lookahead limit for downloaded blocks
lookahead_limit = 1000

[tracing]
# Log output level (info, warn, debug)
filter = "info"
use_color = true
